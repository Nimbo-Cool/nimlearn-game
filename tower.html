<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>燭火深塔</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root { --bg: #0b0a12; --panel: #17141f; --panel2: #211c2c; --line: #3a3048; --text: #ece4d8; --sub: #a59cb3; --gold: #fbbf24; --hp: #ef4444; --st: #a855f7; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: radial-gradient(ellipse at 50% 0%, #2a1d2e 0%, var(--bg) 60%); color: var(--text); font-family: 'Noto Sans TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif; overflow: hidden; user-select: none; -webkit-tap-highlight-color: transparent; }
button { font-family: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: not-allowed; }
img { image-rendering: pixelated; image-rendering: crisp-edges; }
.gold { color: var(--gold); }
.sub { color: var(--sub); font-size: 14px; }
.right { float: right; font-size: 16px; }
.ok { color: #4ade80; }

/* ---------- 上方列 ---------- */
header { height: 52px; display: flex; align-items: center; gap: 10px; padding: 0 12px; background: #120f19cc; border-bottom: 1px solid var(--line); position: relative; z-index: 5; }
header .brand { font-weight: 900; font-size: 20px; letter-spacing: 2px; color: var(--gold); white-space: nowrap; text-shadow: 0 0 12px #f59e0b88; }
header .sp { flex: 1; }
header .hbtn { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; height: 36px; min-width: 40px; padding: 0 10px; font-size: 16px; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; color: var(--text); }
#runInfo { display: flex; gap: 8px; align-items: center; overflow-x: auto; scrollbar-width: none; }
.pill { background: var(--panel2); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 15px; font-weight: 700; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.pill.btnlike { cursor: pointer; }
.lbar { width: 70px; height: 9px; background: #000; border-radius: 9px; overflow: hidden; display: inline-block; }
.lbar span { display: block; height: 100%; transition: width .4s; }
.relics { display: inline-flex; gap: 2px; }
.relic { background: none; border: none; font-size: 20px; padding: 0 2px; }

.screen { display: none; position: absolute; top: 52px; left: 0; right: 0; bottom: 0; }
.screen.on { display: flex; }

/* ---------- 按鈕 ---------- */
.btn { border: none; border-radius: 12px; padding: 10px 20px; font-size: 17px; font-weight: 800; background: var(--panel2); border: 1px solid var(--line); }
.btn.gold { background: linear-gradient(#f59e0b, #b45309); border-color: #fbbf24; color: #1c0f02; box-shadow: 0 0 18px #f59e0b55; }
.btn.gray { background: var(--panel2); }
.btn.big { font-size: 21px; padding: 14px 34px; }
.btn.small { font-size: 14px; padding: 6px 12px; }
.btn:disabled { opacity: .4; }
.btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }

/* ---------- 標題 ---------- */
#scr-title { overflow-y: auto; justify-content: center; }
.title-wrap { width: min(980px, 100%); padding: 18px 16px 40px; display: flex; flex-direction: column; gap: 14px; }
.logo { text-align: center; padding-top: 8px; }
.logo h1 { margin: 4px 0; font-size: 54px; letter-spacing: 12px; color: #fde68a; text-shadow: 0 0 24px #f59e0b, 0 4px 0 #78350f; }
.logo p { margin: 0; color: var(--sub); font-size: 17px; }
.flame { width: 26px; height: 40px; margin: 0 auto; background: radial-gradient(circle at 50% 70%, #fff7cc, #fbbf24 35%, #ea580c 65%, transparent 72%); border-radius: 50% 50% 45% 45%; animation: flick 1.4s infinite alternate; filter: drop-shadow(0 0 16px #f59e0b); }
@keyframes flick { 0% { transform: scale(1, 1) rotate(-2deg); } 50% { transform: scale(.92, 1.08) rotate(2deg); } 100% { transform: scale(1.05, .95) rotate(-1deg); } }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px 18px; }
.panel h3 { margin: 6px 0 10px; font-size: 19px; }
.panel h3 small { color: var(--sub); font-weight: 400; font-size: 14px; }
.panel.cont { border-color: var(--gold); display: flex; flex-direction: column; align-items: center; gap: 4px; }
.panel.row3 { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.diffs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 8px; }
.diff, .cls, .opt { background: var(--panel2); border: 2px solid var(--line); border-radius: 12px; padding: 10px 12px; text-align: left; display: flex; flex-direction: column; gap: 4px; }
.diff b, .cls b, .opt b { font-size: 17px; }
.diff span, .cls span, .opt span, .cls small { color: var(--sub); font-size: 14px; line-height: 1.4; }
.diff.on { border-color: var(--gold); background: #2d2210; }
.classes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.cls { align-items: center; text-align: center; }
.cls img { width: 64px; height: 64px; }
.cls.on { border-color: var(--cc); background: color-mix(in srgb, var(--cc) 18%, var(--panel2)); box-shadow: 0 0 14px color-mix(in srgb, var(--cc) 40%, transparent); }
.lineup { margin-top: 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-weight: 700; }
.lineup em { font-style: normal; background: var(--gold); color: #000; border-radius: 50%; width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center; margin-right: 4px; font-size: 13px; }
.lineup i { color: var(--sub); font-style: normal; }
.stain { text-align: center; color: #f9a8d4; margin: 0; }
.credit { text-align: center; color: #6b6378; font-size: 13px; margin: 0; }
.opts { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.opt:hover:not(:disabled), .diff:hover, .cls:hover { border-color: #8b7aa3; }
.opt:disabled { opacity: .45; }

/* ---------- 地圖 ---------- */
#scr-map { gap: 0; }
.mapside { width: 280px; flex-shrink: 0; padding: 14px; border-right: 1px solid var(--line); background: #120f19aa; overflow-y: auto; }
.mapside h2 { margin: 0 0 10px; font-size: 20px; color: #fde68a; }
.legend { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; font-size: 14px; color: var(--sub); margin: 12px 0 6px; }
.party-mini { display: flex; flex-direction: column; gap: 8px; }
.hmini { display: flex; gap: 8px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; font-size: 14px; }
.hmini > div { flex: 1; }
.hmini img { width: 40px; height: 40px; }
.hmini.dead { opacity: .4; filter: grayscale(1); }
.hmini.door { border-color: #f43f5e; }
.mapscroll { flex: 1; overflow-y: auto; position: relative; }
.mapwrap { position: relative; width: min(560px, 100%); margin: 0 auto; }
.maplines { position: absolute; left: 0; top: 0; }
.maplines line { stroke: #4b405c; stroke-width: 3; stroke-dasharray: 6 6; }
.maplines line.walked { stroke: var(--gold); stroke-dasharray: none; }
.node { position: absolute; transform: translate(-50%, -50%); width: 46px; height: 46px; border-radius: 50%; border: 2px solid #4b405c; background: #1d1827; font-size: 22px; display: flex; align-items: center; justify-content: center; padding: 0; opacity: .7; }
.node.t-boss { width: 74px; height: 74px; font-size: 38px; border-color: #b91c1c; }
.node.visited { opacity: .35; }
.node.here { opacity: 1; border-color: var(--gold); box-shadow: 0 0 0 4px #fbbf2444; }
.node.can { opacity: 1; border-color: var(--gold); animation: glow 1.2s infinite alternate; cursor: pointer; }
.node.can:hover { transform: translate(-50%, -50%) scale(1.15); }
@keyframes glow { from { box-shadow: 0 0 4px #fbbf24; } to { box-shadow: 0 0 20px #fbbf24; } }
.stainmark { position: absolute; right: -8px; top: -8px; font-style: normal; font-size: 16px; }
.bossname { position: absolute; left: 50%; transform: translateX(-50%); color: #fca5a5; font-weight: 800; white-space: nowrap; }

/* ---------- 戰鬥 ---------- */
#scr-battle { flex-direction: column; transition: filter .6s; }
#scr-battle.dim .arena { filter: brightness(.8); }
#scr-battle.dark .arena { filter: brightness(.6) saturate(.7); }
.arena { flex: 1; display: flex; align-items: flex-end; justify-content: center; gap: 20px; padding: 10px 16px 6px; background: linear-gradient(transparent 55%, #00000066 55.2%), radial-gradient(ellipse at 50% 30%, #3b2a3a55, transparent 70%); min-height: 0; transition: filter .6s; }
.side { display: flex; gap: 10px; align-items: flex-end; flex: 1; }
.heroes { justify-content: flex-end; }
.enemies { justify-content: flex-start; }
.vs { width: 20px; }
.unit { position: relative; width: 130px; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 4px; border-radius: 14px; border: 2px solid transparent; transition: border-color .2s, opacity .3s; }
.unit .spr { width: 96px; height: 96px; filter: drop-shadow(0 6px 0 #0008); }
.unit.big { width: 170px; }
.unit.big .spr { width: 150px; height: 150px; }

.unit.tgt { border-color: var(--gold); background: #fbbf2414; cursor: pointer; animation: glow 1s infinite alternate; }
.unit.owner { border-color: #67e8f9; background: #67e8f912; }
.unit.door .spr { filter: drop-shadow(0 0 8px #f43f5e) grayscale(.5); }
.unit.panic .spr { animation: tremble .25s infinite; }
@keyframes tremble { 0%, 100% { translate: 0 0; } 50% { translate: 1px -1px; } }
.unit.hurt .spr { animation: hurt .35s; }
@keyframes hurt { 0% { filter: brightness(3) drop-shadow(0 0 0 red); translate: 0 0; } 40% { translate: -5px 0; } 100% { translate: 0 0; } }
.rank { position: absolute; top: 4px; left: 4px; width: 22px; height: 22px; border-radius: 50%; background: #000a; border: 1px solid var(--line); font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
.uname { font-weight: 800; font-size: 15px; white-space: nowrap; }
.bar { position: relative; width: 100%; height: 16px; background: #000; border-radius: 6px; overflow: hidden; border: 1px solid #000; }
.bar span { position: absolute; left: 0; top: 0; bottom: 0; transition: width .35s; }
.bar.hp span { background: linear-gradient(#f87171, #b91c1c); }
.bar.st { height: 12px; }
.bar.st span { background: linear-gradient(#c084fc, #6b21a8); }
.bar em { position: relative; font-style: normal; font-size: 12px; font-weight: 800; display: block; text-align: center; line-height: 16px; text-shadow: 0 1px 2px #000; }
.bar.st em { line-height: 12px; font-size: 10px; }
.unit.door .bar.hp em { color: #fda4af; }
.blk { position: absolute; right: 2px; top: 0; font-style: normal; font-size: 12px; font-weight: 900; color: #7dd3fc; line-height: 16px; text-shadow: 0 1px 2px #000; }
.sts { display: flex; gap: 2px; flex-wrap: wrap; justify-content: center; min-height: 18px; }
.st { font-size: 12px; background: #000a; border-radius: 6px; padding: 0 4px; }
.intent { position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); background: #1d1827; border: 2px solid var(--line); border-radius: 10px; padding: 3px 8px; font-size: 16px; font-weight: 900; white-space: nowrap; text-align: center; margin-bottom: 4px; }
.intent small { display: block; font-size: 11px; font-weight: 600; color: var(--sub); }
.intent.atk { border-color: #ef4444; }
.intent.stress { border-color: #a855f7; }
.intent.buff { border-color: #38bdf8; }
.hint { height: 26px; text-align: center; color: var(--gold); font-weight: 700; font-size: 15px; }
.handbar { display: flex; align-items: center; gap: 12px; padding: 6px 12px 12px; background: linear-gradient(transparent, #000a); }
.energy { width: 72px; height: 72px; flex-shrink: 0; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #fde68a, #f59e0b 45%, #9a3412); display: flex; align-items: center; justify-content: center; color: #1c0f02; box-shadow: 0 0 20px #f59e0b88; }
.energy b { font-size: 34px; }
.energy small { font-weight: 800; }
.hand { flex: 1; display: flex; gap: 10px; justify-content: center; overflow-x: auto; padding: 24px 6px 4px 16px; min-height: 196px; }
.hand .empty { align-self: center; }
.endwrap { display: flex; flex-direction: column; gap: 6px; align-items: center; flex-shrink: 0; }
.btn.end { background: linear-gradient(#be123c, #7f1d1d); border-color: #fb7185; padding: 14px 16px; display: flex; flex-direction: column; align-items: center; }
.btn.end small { font-size: 11px; opacity: .7; }
.btn.end.pulse { animation: glow 0.9s infinite alternate; }
.piles { display: flex; gap: 10px; font-size: 14px; color: var(--sub); }

/* ---------- 卡牌 ---------- */
.card { position: relative; width: 128px; min-width: 128px; height: 178px; border-radius: 12px; border: 3px solid var(--cc); background: linear-gradient(170deg, color-mix(in srgb, var(--cc) 30%, #1a1622), #14111b 60%); padding: 22px 8px 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; transition: transform .12s; box-shadow: 0 4px 0 #0009; }
.card:hover:not(.no) { transform: translateY(-8px); }
.card.sel { transform: translateY(-16px); box-shadow: 0 0 0 3px #fff, 0 0 24px var(--cc); }
.card.no { filter: grayscale(.7) brightness(.6); }
.card.r2 { border-style: double; border-width: 5px; }
.card.r3 { box-shadow: 0 0 16px #fbbf2488, 0 4px 0 #0009; }
.card.t-curse { background: linear-gradient(#3b0764, #1e0b2e); }
.card.sold { display: flex; align-items: center; justify-content: center; color: var(--sub); border: 2px dashed var(--line); background: none; --cc: #333; }
.cost { position: absolute; top: -12px; left: -12px; width: 34px; height: 34px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #fde68a, #d97706); color: #1c0f02; font-weight: 900; font-size: 19px; display: flex; align-items: center; justify-content: center; border: 2px solid #000; }
.cost.up { background: radial-gradient(circle at 40% 35%, #fca5a5, #b91c1c); color: #fff; }
.cost.down { background: radial-gradient(circle at 40% 35%, #bbf7d0, #16a34a); }
.who { position: absolute; top: 3px; right: 6px; font-size: 11px; font-weight: 800; color: var(--cc); filter: brightness(1.4); }
.cname { font-size: 18px; font-weight: 900; }
.ctype { font-size: 11px; color: var(--sub); }
.ctext { font-size: 13.5px; line-height: 1.35; flex: 1; display: flex; align-items: center; }
.cardrow { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; margin: 14px 0; }
.cardgrid { display: flex; flex-wrap: wrap; gap: 14px 10px; justify-content: center; max-height: 58vh; overflow-y: auto; padding: 16px 6px; }
.shopwrap { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.price { color: var(--gold); font-weight: 800; }

/* ---------- 對話框、提示 ---------- */
#modal { position: fixed; inset: 0; background: #000b; display: none; align-items: center; justify-content: center; z-index: 50; padding: 12px; }
#modal.on { display: flex; }
#modalBox { background: var(--panel); border: 2px solid var(--line); border-radius: 18px; padding: 18px 22px; width: min(620px, 100%); max-height: 94vh; overflow-y: auto; box-shadow: 0 0 40px #000; }
#modalBox.wide { width: min(900px, 100%); }
#modalBox h2 { margin: 0 0 10px; font-size: 24px; color: #fde68a; }
#modalBox p { font-size: 16.5px; line-height: 1.6; margin: 8px 0; }
#modalBox .big { font-size: 22px; text-align: center; }
.help p { font-size: 15.5px !important; }
#toast { position: fixed; top: 60px; left: 50%; transform: translate(-50%, -20px); background: #17141fee; border: 2px solid; border-radius: 12px; padding: 8px 18px; font-weight: 800; font-size: 16px; z-index: 60; opacity: 0; pointer-events: none; transition: .25s; max-width: 92vw; text-align: center; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
.fxtext { position: fixed; z-index: 40; pointer-events: none; font-weight: 900; transform: translateX(-50%); text-shadow: 0 2px 0 #000, 0 0 6px #000; animation: rise 1.1s ease-out forwards; white-space: nowrap; }
@keyframes rise { from { opacity: 1; translate: 0 0; } to { opacity: 0; translate: 0 -60px; } }

/* ---------- 手機、平板 ---------- */
@media (max-width: 900px) {
    #scr-map { flex-direction: column; }
    .mapside { width: 100%; border-right: none; border-bottom: 1px solid var(--line); padding: 6px 8px; overflow: visible; }
    .mapside h2, .mapside .legend, .mapside .sub, .mapside .btn { display: none; }
    .party-mini { flex-direction: row; gap: 4px; }
    .hmini { flex: 1; padding: 3px 4px; gap: 4px; font-size: 12px; min-width: 0; }
    .hmini img { width: 28px; height: 28px; }
    .unit { width: 98px; }
    .unit .spr { width: 68px; height: 68px; }
    .unit.big { width: 128px; }
    .unit.big .spr { width: 104px; height: 104px; }
    .card { width: 108px; min-width: 108px; height: 158px; padding: 20px 6px 6px; }
    .cname { font-size: 16px; }
    .ctext { font-size: 12.5px; }
    .hand { justify-content: flex-start; min-height: 176px; }
    .energy { width: 56px; height: 56px; }
    .energy b { font-size: 26px; }
    .classes { grid-template-columns: repeat(2, 1fr); }
    .diffs { grid-template-columns: 1fr; }
    header .brand { font-size: 16px; }
    .logo h1 { font-size: 40px; letter-spacing: 6px; }
}
@media (max-width: 560px) {
    header { gap: 6px; padding: 0 6px; }
    header .brand { display: none; }
    .pill { padding: 3px 8px; font-size: 13px; }
    .lbar { width: 40px; }
    header .hbtn { min-width: 32px; padding: 0 6px; }
    .arena { gap: 4px; padding: 30px 4px 4px; }
    .side { gap: 2px; }
    .unit { width: 76px; padding: 4px 1px; }
    .unit .spr { width: 52px; height: 52px; }
    .unit.big { width: 104px; }
    .unit.big .spr { width: 84px; height: 84px; }
    .uname { font-size: 12px; }
    .intent { font-size: 13px; padding: 2px 5px; }
    .handbar { flex-wrap: wrap; }
    .hand { order: 3; flex-basis: 100%; }
}

/* ---------- 黑暗地牢式戰鬥 ---------- */
.orderbar { display: flex; align-items: center; gap: 6px; padding: 6px 12px; background: #0008; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; flex-shrink: 0; }
.olabel { color: var(--sub); font-size: 13px; white-space: nowrap; margin-right: 4px; }
.ochip { width: 38px; height: 38px; border-radius: 10px; border: 2px solid; display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: #17141f; }
.ochip img { width: 30px; height: 30px; }
.ochip.h { border-color: #38bdf8; }
.ochip.e { border-color: #ef4444; }
.ochip.now { transform: scale(1.18); box-shadow: 0 0 12px var(--gold); border-color: var(--gold); margin: 0 6px; }
.unit.cur { border-color: var(--gold); background: #fbbf2410; }
.unit.cur::after { content: '▼'; position: absolute; top: -20px; left: 50%; transform: translateX(-50%); color: var(--gold); font-size: 16px; animation: bob .8s infinite alternate; }
.unit.enemy.cur::after { top: auto; bottom: -18px; content: '▲'; }
@keyframes bob { to { translate: 0 4px; } }
.actbar { display: flex; gap: 12px; align-items: stretch; padding: 8px 12px 12px; background: linear-gradient(transparent, #000a); min-height: 150px; }
.actbar .curwho { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 96px; flex-shrink: 0; text-align: center; }
.actbar .curwho img { width: 64px; height: 64px; }
.actbar .curwho span { display: block; font-size: 12px; color: var(--sub); }
.actbar .waiting { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--sub); font-size: 18px; }
.skills { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.skill { position: relative; background: var(--panel2); border: 2px solid var(--line); border-radius: 12px; padding: 8px 8px 6px; text-align: left; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.skill b { font-size: 17px; }
.skill small { color: var(--gold); font-weight: 700; margin-left: 4px; }
.skill .kn { position: absolute; top: 4px; right: 8px; color: #6b6378; font-size: 12px; font-weight: 800; }
.skill:hover:not(.no) { border-color: #8b7aa3; transform: translateY(-2px); }
.skill.sel { border-color: var(--gold); box-shadow: 0 0 14px #fbbf2466; }
.skill.no { opacity: .45; }
.skd { font-size: 13px; color: #d6cfe0; line-height: 1.35; }
.side-acts { display: flex; flex-direction: column; gap: 6px; width: 150px; flex-shrink: 0; }
.side-acts .btn { width: 100%; }
.side-acts .btn small { opacity: .6; font-size: 11px; }
.btn.sel { border-color: var(--gold); box-shadow: 0 0 10px #fbbf2466; }
.btn.wide { width: 100%; margin-top: 8px; }
.items { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.item { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; font-size: 18px; padding: 3px 0; display: flex; flex-direction: column; align-items: center; line-height: 1.1; }
.item b { font-size: 11px; }
.item:disabled { opacity: .3; }
.item.sel { border-color: var(--gold); }
.pips { display: inline-flex; gap: 2px; align-items: center; vertical-align: middle; }
.pips i { width: 10px; height: 10px; border-radius: 50%; background: #3a3048; display: inline-block; }
.pips i.u { background: #facc15; }
.pips i.t { background: #ef4444; }
.pips em { color: #6b6378; font-style: normal; margin: 0 2px; font-size: 11px; }
.skillname { position: fixed; z-index: 41; transform: translate(-50%, -100%); padding: 3px 12px; border-radius: 8px; font-weight: 900; font-size: 16px; pointer-events: none; white-space: nowrap; animation: fadeout 1s forwards; }
.skillname.h { background: #0c4a6e; border: 2px solid #38bdf8; }
.skillname.e { background: #7f1d1d; border: 2px solid #f87171; }
@keyframes fadeout { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
.partylist { display: flex; flex-direction: column; gap: 10px; max-height: 62vh; overflow-y: auto; }
.prow { background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; }
.prow.dead { opacity: .4; }
.phead { display: flex; align-items: center; gap: 10px; }
.phead img { width: 44px; height: 44px; }
.phead > div { flex: 1; }
.phead .rk { width: 26px; height: 26px; border-radius: 50%; background: var(--gold); color: #000; font-weight: 900; display: flex; align-items: center; justify-content: center; }
.arrows { display: flex; gap: 4px; }
.arrows button { width: 40px; height: 36px; border-radius: 8px; background: #2d2638; border: 1px solid var(--line); font-size: 16px; }
.pskills { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; }
.sk { background: #17141f; border: 2px solid var(--line); border-radius: 10px; padding: 6px 8px; text-align: left; font-size: 14px; display: flex; flex-direction: column; gap: 2px; }
.sk small { color: var(--gold); }
.sk.on { border-color: #4ade80; background: #14301f; }
.sk.locked { color: #6b6378; justify-content: center; }
.sk .skd { font-size: 12px; }
.itemrow { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
.opt.small b { font-size: 15px; }
@media (max-width: 900px) {
    .actbar { flex-wrap: wrap; }
    .actbar .curwho { width: 100%; flex-direction: row; gap: 8px; }
    .actbar .curwho img { width: 36px; height: 36px; }
    .actbar .curwho span { display: inline; margin-left: 6px; }
    .skills { grid-template-columns: repeat(2, 1fr); flex-basis: 100%; }
    .side-acts { width: 100%; flex-direction: row; flex-wrap: wrap; }
    .side-acts .btn { width: auto; flex: 1; }
    .items { flex: 1 1 100%; }
    .pskills { grid-template-columns: repeat(2, 1fr); }
    .classes { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 560px) {
    .skill b { font-size: 15px; }
    .skd { font-size: 12px; }
    .ochip { width: 30px; height: 30px; }
    .ochip img { width: 24px; height: 24px; }
    .olabel { display: none; }
    .unit { width: 70px; }
    .unit.big { width: 96px; }
}
@media (max-width: 560px) {
    .arena { gap: 2px; padding: 34px 2px 4px; }
    .side { gap: 1px; min-width: 0; }
    .vs { width: 4px; }
    .unit { width: auto; flex: 1 1 0; min-width: 0; max-width: 64px; padding: 2px 0; border-width: 1px; }
    .unit.big { max-width: 92px; flex-grow: 1.6; }
    .unit .spr, .unit.big .spr { width: 100%; height: auto; }
    .uname { font-size: 10px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
    .bar { height: 12px; }
    .bar em { font-size: 9px; line-height: 12px; }
    .bar.st { height: 9px; }
    .bar.st em { font-size: 8px; line-height: 9px; }

    .rank { width: 16px; height: 16px; font-size: 10px; top: 0; left: 0; }

    .st { font-size: 9px; padding: 0 2px; }
    .actbar { padding: 6px 8px 10px; gap: 6px; min-height: 0; }

const MAP_ROWS = 11, MAP_COLS = 5;
const NODE_INFO = {
    fight: { i: '⚔️', n: '戰鬥' }, elite: { i: '💀', n: '菁英' }, event: { i: '❓', n: '事件' },
    rest: { i: '🔥', n: '營火' }, shop: { i: '🛒', n: '商人' }, treasure: { i: '💎', n: '寶物' }, boss: { i: '👑', n: '魔王' }
};
function genMap(act) {
    const nodes = {};
    const key = (r, c) => r + ',' + c;
    const starts = shuffle([0, 1, 2, 3, 4]).slice(0, 3).concat([rand(5)]);
    starts.forEach(c0 => {
        let c = c0;
        for (let r = 0; r < MAP_ROWS; r++) {
            const k = key(r, c);
            nodes[k] = nodes[k] || { r, c, t: null, next: [] };
            if (r < MAP_ROWS - 1) {
                let nc = clamp(c + rand(3) - 1, 0, MAP_COLS - 1);
                const cross = nodes[key(r, nc)] && nodes[key(r, nc)].next.includes(c) && nc !== c;
                if (cross) nc = c;
                if (!nodes[k].next.includes(nc)) nodes[k].next.push(nc);
                c = nc;
            }
        }
    });
    Object.values(nodes).forEach(n => {
        if (n.r === 0) n.t = 'fight';
        else if (n.r === MAP_ROWS - 1) n.t = 'rest';
        else if (n.r === 5) n.t = 'treasure';
        else {
            const w = [['fight', 46], ['event', 22], ['elite', n.r >= 3 ? 12 : 0], ['rest', n.r >= 3 && n.r !== MAP_ROWS - 2 ? 9 : 0], ['shop', n.r >= 2 ? 11 : 0]];
            let x = Math.random() * w.reduce((s, a) => s + a[1], 0);
            n.t = w.find(a => (x -= a[1]) < 0)[0];
        }
    });

}
function reachable() {

    if (RUN.pos.r === MAP_ROWS - 1) return [M.boss];
    const cur = M.nodes[RUN.pos.r + ',' + RUN.pos.c];

}

function partyMove(uid, d) {
    const h = RUN.party.find(x => x.uid === uid);

    if (j < 0 || j >= L.length) return;

    else { if (h.equip.length >= 4) { toast('最多帶 4 招，先換下一招', '#94a3b8'); return; } h.equip.push(k); }

function renderMap() {
    const M = RUN.map, can = reachable();
    const rowH = 66, H = (MAP_ROWS + 1) * rowH + 40;
    const X = c => 10 + c * 20, Y = r => H - 40 - r * rowH;
    let lines = '', nodes = '';
    Object.values(M.nodes).forEach(n => {
        const nexts = n.r === MAP_ROWS - 1 ? [{ x: 50, y: Y(MAP_ROWS) }] : n.next.map(c => ({ x: X(c), y: Y(n.r + 1) }));
        nexts.forEach(p => {
            const to = n.r === MAP_ROWS - 1 ? MAP_ROWS + ',b' : (n.r + 1) + ',' + ((p.x - 10) / 20);
            const ia = M.visited.indexOf(n.r + ',' + n.c), walked = ia >= 0 && M.visited[ia + 1] === to;
            lines += `<line x1="${X(n.c)}%" y1="${Y(n.r)}" x2="${p.x}%" y2="${p.y}" class="${walked ? 'walked' : ''}"/>`;
        });
    });
    const nodeBtn = (n, x, y) => {
        const id = n.r + ',' + (n.c ?? 'b');
        const visited = M.visited.includes(id), here = RUN.pos && RUN.pos.r === n.r && (n.c == null || RUN.pos.c === n.c), ok = can.includes(n);
        const info = NODE_INFO[n.t];
        const stain = META.stain && META.stain.act === RUN.act && META.stain.row === n.r && !visited;
        return `<button class="node t-${n.t} ${ok ? 'can' : ''} ${visited ? 'visited' : ''} ${here ? 'here' : ''}" style="left:${x}%;top:${y}px" title="${info.n}"
            ${ok ? `onclick="enterNodeKey('${id}')"` : 'disabled'}>${info.i}${stain ? '<i class="stainmark">🩸</i>' : ''}</button>`;
    };
    Object.values(M.nodes).forEach(n => nodes += nodeBtn(n, X(n.c), Y(n.r)));
    nodes += nodeBtn(M.boss, 50, Y(MAP_ROWS));
    $('scr-map').innerHTML = `
        <div class="mapside">
            <h2>${ACTS[RUN.act].name}</h2>
            <div class="party-mini">${alive().concat(RUN.party.filter(h => h.dead)).map(h => heroMini(h)).join('')}</div>
            <button class="btn gray small wide" onclick="showParty()">👥 站位與技能</button>
            <div class="legend">${Object.entries(NODE_INFO).map(([k, v]) => `<span>${v.i} ${v.n}</span>`).join('')}</div>
            <p class="sub">點發亮的格子前進。</p>
        </div>
        <div class="mapscroll" id="mapScroll"><div class="mapwrap" style="height:${H}px">
            <svg class="maplines" width="100%" height="${H}">${lines}</svg>${nodes}
            <div class="bossname" style="top:${Y(MAP_ROWS) - 58}px">${ENEMIES[ACTS[RUN.act].boss[0]].n}</div>
        </div></div>`;
    const sc = $('mapScroll');
    const target = RUN.pos ? Y(RUN.pos.r) : Y(0);
    sc.scrollTop = Math.max(0, target - sc.clientHeight * 0.6);
}
function enterNodeKey(id) {
    const n = id.endsWith(',b') ? RUN.map.boss : RUN.map.nodes[id];
    if (n) enterNode(n);
}
function heroMini(h) {
    const C = CLASSES[h.cls];
    return `<div class="hmini ${h.dead ? 'dead' : ''} ${h.door ? 'door' : ''}">

function renderBattle() {
    if (!B) return;
    renderTop();

    if (myTurn && B.mode) {
        if (B.mode.kind === 'skill') tg = skillTargets(cur, B.mode.k);

                <div class="items">${ITEM_KEYS.map(k => `<button class="item ${B.mode && B.mode.kind === 'item' && B.mode.k === k ? 'sel' : ''}" onclick="clickItem('${k}')" ${RUN.items[k] > 0 ? '' : 'disabled'} title="${ITEMS[k].n}：${ITEMS[k].d}（不算行動）">${ITEMS[k].i}<b>${RUN.items[k] || 0}</b></button>`).join('')}</div>

        : RUN.light < 25 ? '🌑 太暗了！每輪全隊壓力 +3，敵人傷害 +25%' : '';

function unitImg(u) {
    if (isHero(u)) return PIXEL.hero(u.cls);

    return p[0] === 'mob' ? PIXEL.mob(p[1]) : PIXEL.boss(p[1]);
}
function unitHTML(u, targetable, isCur) {
    const hero = isHero(u);
    const sts = Object.entries(u.st).filter(([k, v]) => v > 0).map(([k, v]) => `<span class="st" title="${ST_NAME[k]}：${ST_DESC[k]}">${ST_ICON[k]}${v}</span>`).join('');
    let intent = '';
    if (!hero && u.intent) {
        const it = u.intent;
        const parts = [];
        if (it.a != null) parts.push(`⚔️${intentDmg(u, it)}${it.hits > 1 ? '×' + it.hits : ''}`);
        if (it.s) parts.push(`😨${it.s}`);
        if (it.b) parts.push(`🛡️`);
        if (it.str) parts.push(`💪`);
        if (it.summon) parts.push(`📯`);
        if (it.light) parts.push(`🌑`);
        if (it.bleed || it.weak || it.vuln) parts.push('☠️');
        let tgt = '';
        if (it.targets === 'all') tgt = '全體';
        else if (it.targets) { const t = realTarget(RUN.party.find(h => h.uid === it.targets && !h.dead)); tgt = t ? '→' + t.name : ''; }
        intent = `<div class="intent ${it.a != null ? 'atk' : it.s ? 'stress' : 'buff'}" title="${it.n}">${parts.join(' ')}<small>${it.n}${tgt ? ' ' + tgt : ''}</small></div>`;
    }
    const big = !hero && ENEMIES[u.key].px[0] === 'boss';
    const C = hero ? CLASSES[u.cls] : null;
    return `<div class="unit ${hero ? 'hero' : 'enemy'} ${big ? 'big' : ''} ${targetable ? 'tgt' : ''} ${isCur ? 'cur' : ''} ${u.door ? 'door' : ''} ${hero && u.aff ? 'panic' : ''}"

        <img class="spr" src="${unitImg(u)}" alt="">

        <div class="bar hp"><span style="width:${100 * u.hp / u.maxHp}%"></span><em>${u.door ? '瀕死' : u.hp + '/' + u.maxHp}</em>${u.block ? `<i class="blk">🛡️${u.block}</i>` : ''}</div>
        ${hero ? `<div class="bar st" title="壓力：滿 100 會崩潰或覺醒"><span style="width:${u.stress / 2}%"></span><em>😨 ${u.stress}</em></div>` : ''}

    </div>`;
}
function unitEl(u) { return u ? document.querySelector(`.unit[data-uid="${u.uid}"]`) : null; }
function fxText(el, text, color, size = 26) {
    if (!el || FAST) return;
    const r = el.getBoundingClientRect();
    const d = document.createElement('div');
    d.className = 'fxtext';
    d.textContent = text;
    d.style.cssText = `left:${r.left + r.width / 2 + (Math.random() * 30 - 15)}px;top:${r.top + r.height * 0.35}px;color:${color};font-size:${size}px`;
    document.body.appendChild(d);
    setTimeout(() => d.remove(), 1100);
}
function showSkillName(u, n) {
    if (FAST) return;
    const el = unitEl(u); if (!el) return;
    const r = el.getBoundingClientRect();
    const d = document.createElement('div');
    d.className = 'skillname ' + (isHero(u) ? 'h' : 'e');
    d.textContent = n;
    d.style.cssText = `left:${r.left + r.width / 2}px;top:${r.top - 6}px`;
    document.body.appendChild(d);
    setTimeout(() => d.remove(), 1000);
}
function flashEl(el) {
    if (!el || FAST) return;
    el.classList.remove('hurt'); void el.offsetWidth; el.classList.add('hurt');
}
async function lunge(el, dir) {
    if (!el || FAST) return;
    const s = el.querySelector('.spr') || el;
    s.animate([{ transform: 'translateX(0)' }, { transform: `translateX(${dir * 30}px) scale(1.1)` }, { transform: 'translateX(0)' }], { duration: 280, easing: 'ease-out' });
    await wait(160);
}

// ---------- 鍵盤 ----------
document.addEventListener('keydown', e => {
    if ($('modal').classList.contains('on')) return;
    if (!B || document.body.dataset.screen !== 'battle') return;
    const cur = findUnit(B.cur);
    if (!cur || !isHero(cur) || B.busy) return;
    if (/^[1-4]$/.test(e.key)) { const k = cur.equip[+e.key - 1]; if (k) clickSkill(k); e.preventDefault(); }
    else if (e.key === 'm' || e.key === 'M') clickMove();
    else if (e.key === ' ') { clickPass(); e.preventDefault(); }
    else if (e.key === 'Escape') { B.mode = null; renderBattle(); }
});

});

function goTitle() {
    if (B && B.busy) return;
    closeModal();
    B = null;
    showScreen('title');
    renderTitle();
}
